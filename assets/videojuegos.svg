<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070b"/>
      <stop offset="50%" stop-color="#12080d"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Strong Red Neon Sci-Fi Glow -->
    <radialGradient id="redSciFiGlow" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#991b1b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Geometric Grid Pattern -->
    <pattern id="geoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ef4444" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#geoGrid)"/>
  <rect width="800" height="500" fill="url(#redSciFiGlow)"/>

  <!-- Sci-Fi Red Neon Diagonal Lines & Accents -->
  <g fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5">
    <polygon points="680,20 780,90 730,150" fill="#ef4444" fill-opacity="0.06"/>
    <polygon points="40,390 130,450 60,490" fill="#dc2626" fill-opacity="0.05"/>
    <line x1="620" y1="0" x2="800" y2="180" stroke-opacity="0.5"/>
    <line x1="0" y1="320" x2="180" y2="500" stroke-opacity="0.3"/>
  </g>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="800" height="64" fill="#07070b" fill-opacity="0.92" stroke="#261014" stroke-width="1"/>
  
  <!-- Circular Gamelounge Logo -->
  <g transform="translate(36, 32)">
    <circle cx="0" cy="0" r="18" fill="#140a0e" stroke="#ef4444" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="#ef4444" fill-opacity="0.25"/>
    <!-- Gamepad Icon inside logo -->
    <path d="M-7 -3 L7 -3 C9 -3 10 -1 9 2 L6 7 C5 9 3 9 2 7 L0 4 L-2 7 C-3 9 -5 9 -6 7 L-9 2 C-10 -1 -9 -3 -7 -3 Z" fill="#ffffff" transform="scale(0.8)"/>
  </g>
  <text x="64" y="38" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1">GAMELOUNGE</text>
  <text x="64" y="50" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="2">GAMESTORE</text>

  <!-- Nav Links: Home, Acerca de, Juegos, Contactos -->
  <g fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <text x="230" y="37" fill="#ffffff">Home</text>
    <text x="285" y="37">Acerca de</text>
    <text x="365" y="37">Juegos</text>
    <text x="430" y="37">Contactos</text>
  </g>

  <!-- Auth Buttons: Log in & Red Sign Up -->
  <g transform="translate(630, 20)">
    <!-- Log in -->
    <rect x="0" y="0" width="70" height="26" rx="4" fill="transparent" stroke="#374151" stroke-width="1"/>
    <text x="35" y="17" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Log in</text>
    
    <!-- Sign Up (Red) -->
    <rect x="80" y="0" width="80" height="26" rx="4" fill="#dc2626"/>
    <text x="120" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Sign Up</text>
  </g>

  <!-- Central Carousel / Hero Banner (Framed in a Red Border) -->
  <g transform="translate(80, 88)" filter="url(#shadow)">
    <!-- Banner Card Background with Red Border -->
    <rect width="640" height="280" rx="12" fill="#0d080c" stroke="#ef4444" stroke-width="2.5"/>
    <rect width="640" height="280" rx="12" fill="url(#redSciFiGlow)" fill-opacity="0.6"/>

    <!-- Black PlayStation 5 DualSense Controller Graphic -->
    <g transform="translate(320, 150)">
      <!-- Controller Glow -->
      <ellipse cx="0" cy="15" rx="95" ry="45" fill="#ef4444" fill-opacity="0.25" filter="blur(15px)"/>
      
      <!-- Black DualSense Body Shape -->
      <path d="M-75 -10 C-75 -35 -40 -45 0 -45 C40 -45 75 -35 75 -10 C85 15 95 35 75 50 C55 65 35 45 25 30 C10 25 -10 25 -25 30 C-35 45 -55 65 -75 50 C-95 35 -85 15 -75 -10 Z" fill="#0f0f13" stroke="#ef4444" stroke-width="2"/>
      
      <!-- Touchpad / Center Light Bar -->
      <rect x="-30" y="-32" width="60" height="22" rx="4" fill="#07070a" stroke="#ef4444" stroke-width="1"/>
      <line x1="-20" y1="-21" x2="20" y2="-21" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

      <!-- D-Pad & Action Buttons -->
      <circle cx="-48" cy="-10" r="10" fill="#07070a" stroke="#374151" stroke-width="1"/>
      <circle cx="48" cy="-10" r="10" fill="#07070a" stroke="#374151" stroke-width="1"/>
      
      <!-- Thumbsticks -->
      <circle cx="-25" cy="15" r="12" fill="#07070a" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="25" cy="15" r="12" fill="#07070a" stroke="#ef4444" stroke-width="1.5"/>
    </g>

    <!-- PS5 Logo & "THE FUTURE OF GAMING" Text -->
    <g transform="translate(60, 50)">
      <!-- PS5 Badge -->
      <rect x="0" y="0" width="64" height="28" rx="4" fill="#003791"/>
      <text x="32" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">PS5™</text>
      
      <!-- Tagline -->
      <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="2">THE FUTURE OF</text>
      <text x="0" y="98" fill="#ef4444" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="3">GAMING</text>
      
      <text x="0" y="130" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Inmersión absoluta con retroalimentación háptica y gatillos adaptativos.</text>
    </g>

    <!-- Carousel Indicators -->
    <g transform="translate(320, 255)">
      <circle cx="-20" cy="0" r="4" fill="#4b5563"/>
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <circle cx="20" cy="0" r="4" fill="#4b5563"/>
    </g>
  </g>

  <!-- Lower Corner Promotional Boxes: JOE DANGER 2 & LIMBO -->
  <!-- Left Box: JOE DANGER 2 THE MOVIE -->
  <g transform="translate(80, 388)" filter="url(#shadow)">
    <rect width="310" height="85" rx="8" fill="#0d080c" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="10" y="10" width="80" height="65" rx="6" fill="#180b10"/>
    <path d="M40 30 L60 42 L40 54 Z" fill="#ef4444"/>
    <text x="102" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">JOE DANGER 2</text>
    <text x="102" y="48" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">THE MOVIE</text>
    <rect x="102" y="58" width="55" height="18" rx="3" fill="#ef4444" fill-opacity="0.25"/>
    <text x="129" y="70" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SPECIAL</text>
  </g>

  <!-- Right Box: LIMBO -->
  <g transform="translate(410, 388)" filter="url(#shadow)">
    <rect width="310" height="85" rx="8" fill="#0d080c" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="10" y="10" width="80" height="65" rx="6" fill="#180b10"/>
    <circle cx="50" cy="42" r="12" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="47" cy="40" r="2" fill="#000000"/>
    <circle cx="53" cy="40" r="2" fill="#000000"/>
    <text x="102" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1">LIMBO</text>
    <text x="102" y="54" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Atmospheric Puzzle Platformer</text>
    <rect x="102" y="62" width="45" height="16" rx="3" fill="#ef4444" fill-opacity="0.25"/>
    <text x="124" y="73" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">INDIE</text>
  </g>
</svg>
